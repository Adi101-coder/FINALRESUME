services:
  - type: web
    name: resumebuild-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright playwright install --with-deps chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    disk:
      name: resumebuild-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/ms-playwright
      - key: DEBUG
        value: false
      - key: SQL_ECHO
        value: false
      - key: EMBEDDING_FALLBACK
        value: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/resumebuild.db
      - key: STORAGE_PATH
        value: /var/data/storage
      - key: OPENAI_API_KEY
        sync: false
