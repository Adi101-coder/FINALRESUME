services:
  - type: web
    name: resumebuild-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./resumebuild.db
      - key: CORS_ORIGINS
        value: "https://resumebuild-frontend.vercel.app"
      - key: EMBEDDING_FALLBACK
        value: "true"
